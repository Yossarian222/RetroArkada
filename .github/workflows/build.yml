name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Cache libretro jadier
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cores-${{ hashFiles('scripts/cores.txt') }}

      - name: Stiahnuť libretro jadrá
        run: ./scripts/download-cores.sh

      - name: Rozbaliť podpisový kľúč
        env:
          KS: ${{ secrets.ARKADA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/arkada.p12"
            echo "ARKADA_KS_PATH=$RUNNER_TEMP/arkada.p12" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Chýba secret ARKADA_KEYSTORE_B64 – release bez neho nepodpíšem."
            exit 1
          else
            echo "::warning::Bez ARKADA_KEYSTORE_B64 – APK je podpísané debug kľúčom."
          fi

      - name: Zostaviť APK
        env:
          ARKADA_KS_PASS: ${{ secrets.ARKADA_KS_PASS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Premenovať APK
        run: cp app/build/outputs/apk/release/app-release.apk RetroArkada.apk && ls -la RetroArkada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RetroArkada
          path: RetroArkada.apk

      - name: Zverejniť ako release „latest“
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > version.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest RetroArkada.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Retro Arkáda – najnovšia verzia (build ${{ github.run_number }})" \
            --notes "Stiahni RetroArkada.apk a nainštaluj na Android TV."
