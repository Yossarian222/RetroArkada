name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Cache libretro jadier
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cores-${{ hashFiles('scripts/cores.txt') }}

      - name: Stiahnuť libretro jadrá
        run: ./scripts/download-cores.sh

      - name: Databáza arkádových hier (FBNeo DAT)
        run: |
          curl -fsSL --retry 4 --retry-delay 3 -o fbneo.dat \
            "https://raw.githubusercontent.com/libretro/FBNeo/master/dats/FinalBurn%20Neo%20(ClrMame%20Pro%20XML%2C%20Arcade%20only).dat"
          python3 scripts/build-arcade-index.py fbneo.dat app/src/main/assets/fbneo.idx

      - name: Zostaviť APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Premenovať APK
        run: cp app/build/outputs/apk/release/app-release.apk RetroArkada.apk && ls -la RetroArkada.apk

      - name: Skontrolovať databázu arkádových hier v APK
        run: unzip -l RetroArkada.apk | grep -q ' assets/fbneo.idx$' || { echo "V APK chýba assets/fbneo.idx" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: RetroArkada
          path: RetroArkada.apk

      - name: Zverejniť ako release „latest“
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > version.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest RetroArkada.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Retro Arkáda – najnovšia verzia (build ${{ github.run_number }})" \
            --notes "Stiahni RetroArkada.apk a nainštaluj na Android TV."
